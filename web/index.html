<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIB84 — Biblioteca</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            base: '#0a0a0a', surface: '#111111', card: '#161616',
            border: '#1e1e1e', muted: '#71717a', subtle: '#a1a1aa',
            text: '#e4e4e7', blue: '#2563eb', 'blue-h': '#1d4ed8',
          },
          fontFamily: { mono: ['"JetBrains Mono"', 'monospace'] },
        },
      },
    };
  </script>
  <style>
    body { font-family: 'JetBrains Mono', monospace; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #2563eb66; border-radius: 999px; }
    .nav-link.active { color: #2563eb; border-bottom: 2px solid #2563eb; }
    .input-field {
      background: #161616; border: 1px solid #1e1e1e; color: #e4e4e7;
      font-size: 12px; border-radius: 6px; padding: 6px 10px;
      outline: none; width: 100%; color-scheme: dark;
    }
    .input-field:focus { border-color: #2563eb; }
  </style>
</head>
<body class="bg-base text-text min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-surface border-b border-border px-6 py-3 flex items-center justify-between gap-4 flex-wrap sticky top-0 z-30">
    <div class="flex items-center gap-4">
      <span class="text-white font-semibold tracking-widest text-sm">LIB84</span>
      <div class="flex items-center gap-2 text-xs">
        <select id="api-version" class="bg-card border border-border text-subtle rounded px-2 py-1 outline-none">
          <option value="1">V1 (Padrão)</option>
          <option value="2">V2 (Autenticada)</option>
        </select>
        <span id="auth-area"></span>
      </div>
    </div>
    <nav class="flex gap-1 text-xs text-subtle overflow-x-auto">
      <button data-act="tab" data-res="books"      class="nav-link px-3 py-1.5 hover:text-text">Livros</button>
      <button data-act="tab" data-res="authors"    class="nav-link px-3 py-1.5 hover:text-text">Autores</button>
      <button data-act="tab" data-res="categories" class="nav-link px-3 py-1.5 hover:text-text">Categorias</button>
      <button data-act="tab" data-res="suppliers"  class="nav-link px-3 py-1.5 hover:text-text">Fornecedores</button>
      <button data-act="tab" data-res="users"      class="nav-link px-3 py-1.5 hover:text-text">Usuários</button>
      <button data-act="tab" data-res="loans"      class="nav-link px-3 py-1.5 hover:text-text">Empréstimos</button>
    </nav>
  </header>

  <!-- Conteúdo -->
  <main class="flex-1 px-6 py-8 max-w-6xl mx-auto w-full">
    <div class="flex items-center justify-between mb-6 gap-4 flex-wrap">
      <div>
        <h2 id="view-title" class="text-white font-semibold text-lg"></h2>
        <p id="view-subtitle" class="text-muted text-xs mt-0.5"></p>
      </div>
      <button id="btn-new" data-act="new" class="bg-blue hover:bg-blue-h text-white text-xs px-4 py-2 rounded transition-colors disabled:opacity-40">+ Novo</button>
    </div>

    <div id="toolbar" class="mb-4 flex flex-wrap gap-2 items-center"></div>
    <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    <div id="pagination" class="mt-6 flex flex-wrap gap-3 items-center justify-center text-xs text-muted"></div>
  </main>

  <footer class="bg-surface border-t border-border text-center text-xs text-muted py-4">
    <p>Feito para apresentação acadêmica — LIB84</p>
  </footer>

  <!-- Overlay -->
  <div id="overlay" class="hidden fixed inset-0 bg-black/70 z-40"></div>

  <!-- Modal: Login (V2) -->
  <div id="modal-login" class="modal hidden fixed z-50 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-surface border border-border rounded-xl p-6 w-full max-w-sm shadow-2xl">
    <h3 class="text-white font-semibold mb-1">Autenticação (V2)</h3>
    <p class="text-muted text-xs mb-4">Entre com uma conta existente ou crie uma nova.</p>
    <div class="space-y-3">
      <div>
        <label class="text-xs text-muted block mb-1">E-mail</label>
        <input id="auth-email" type="email" autocomplete="username" class="input-field">
      </div>
      <div>
        <label class="text-xs text-muted block mb-1">Senha</label>
        <input id="auth-password" type="password" autocomplete="current-password" class="input-field">
      </div>
    </div>
    <div class="flex gap-2 mt-5">
      <button data-act="do-login" class="flex-1 bg-blue hover:bg-blue-h text-white text-xs py-2 rounded transition-colors">Entrar</button>
      <button data-act="do-register" class="flex-1 border border-border text-subtle hover:text-text text-xs py-2 rounded transition-colors">Criar conta</button>
    </div>
    <p id="auth-status" class="text-subtle text-xs mt-3 text-center min-h-[1rem]"></p>
    <button data-act="close" class="mt-2 w-full text-xs text-muted hover:text-subtle">Fechar</button>
  </div>

  <!-- Modal: Formulário genérico (criar/editar) -->
  <form id="modal-form" class="modal hidden fixed z-50 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-surface border border-border rounded-xl p-6 w-full max-w-md shadow-2xl">
    <h3 id="form-title" class="text-white font-semibold mb-4"></h3>
    <div id="form-fields" class="space-y-3 max-h-[60vh] overflow-y-auto pr-1"></div>
    <p id="form-error" class="text-red-400 text-xs mt-3 hidden"></p>
    <div class="flex gap-2 mt-5">
      <button type="submit" id="btn-save" class="flex-1 bg-blue hover:bg-blue-h text-white text-xs py-2 rounded transition-colors disabled:opacity-40">Salvar</button>
      <button type="button" data-act="close" class="flex-1 border border-border text-subtle hover:text-text text-xs py-2 rounded transition-colors">Cancelar</button>
    </div>
  </form>

  <!-- Modal: Confirmação de exclusão -->
  <div id="modal-confirm" class="modal hidden fixed z-50 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-surface border border-border rounded-xl p-6 w-full max-w-sm shadow-2xl">
    <h3 class="text-white font-semibold mb-2">Confirmar exclusão</h3>
    <p id="confirm-text" class="text-subtle text-xs mb-5"></p>
    <div class="flex gap-2">
      <button id="confirm-yes" class="flex-1 bg-red-700 hover:bg-red-800 text-white text-xs py-2 rounded transition-colors">Excluir</button>
      <button data-act="close" class="flex-1 border border-border text-subtle hover:text-text text-xs py-2 rounded transition-colors">Cancelar</button>
    </div>
  </div>

  <!-- Notificações -->
  <div id="toasts" class="fixed bottom-4 right-4 flex flex-col gap-2 z-50"></div>

  <script src="script.js"></script>
</body>
</html>
