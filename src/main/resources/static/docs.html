<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LIB84 API Docs</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="stylesheet" href="/swagger-ui/swagger-ui.css" />
    <link rel="stylesheet" href="/swagger-theme.css" />
</head>
<body>
<header class="lib84-header">
    <video autoplay muted loop playsinline class="bg-video">
        <source src="library.mp4" type="video/mp4">
    </video>
    <img src="/logo.png" alt="LIB84" />
    <span>LIB84 API Docs</span>
</header>

<div id="swagger-ui"></div>

<script src="/swagger-ui/swagger-ui-bundle.js"></script>
<script src="transition.js"></script>
<script>
    window.onload = () => {
        window.ui = SwaggerUIBundle({
            url: "/api-docs",
            dom_id: "#swagger-ui",
            presets: [SwaggerUIBundle.presets.apis],
            layout: "BaseLayout",
            docExpansion: "list",
            deepLinking: true,
            defaultModelsExpandDepth: 1,
            displayRequestDuration: true,
            filter: true,
            syntaxHighlight: { theme: "arta" },

            tagsSorter: "alpha",        // ordem alfabética
            operationsSorter: (a, b) => {
                const order = {
                    get: 0,
                    post: 1,
                    put: 2,
                    patch: 3,
                    delete: 4
                };

                return (order[a.get("method")] ?? 99) -
                    (order[b.get("method")] ?? 99);
            },
        });
    };
</script>
</body>
</html>
